<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>coordinates_of_shadows</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #060606;
      --white: #f0ece4;
      --dim: #444;
      --accent: #c8b89a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }

    /* scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
      opacity: 0.2;
      pointer-events: none;
      z-index: 99;
    }

    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 98;
    }

    /* LOADER */
    #loader {
      position: fixed; inset: 0;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: loaderFade 0.6s ease forwards;
      animation-delay: 2.4s;
    }

    .loader-text {
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--dim);
      overflow: hidden;
      white-space: nowrap;
      border-right: 1px solid var(--accent);
      width: 0;
      animation: typing 2s steps(28) forwards, cursorBlink 0.7s step-end infinite;
      animation-delay: 0.3s, 0.3s;
    }

    @keyframes typing {
      from { width: 0; }
      to   { width: 28ch; }
    }
    @keyframes cursorBlink {
      50% { border-color: transparent; }
    }
    @keyframes loaderFade {
      to { opacity: 0; pointer-events: none; }
    }

    /* SCENE */
    .scene {
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      opacity: 0;
      animation: sceneFadeIn 1s ease forwards;
      animation-delay: 2.8s;
    }

    @keyframes sceneFadeIn {
      to { opacity: 1; }
    }

    /* top bar */
    .top-bar {
      position: absolute;
      top: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .coord-tag {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--dim);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 3.2s;
    }

    .blink-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards, pulse 2s ease-in-out infinite;
      animation-delay: 3.4s, 3.4s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* sweep line */
    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      opacity: 0;
      animation: sweepDown 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
      animation-delay: 2.9s;
    }

    @keyframes sweepDown {
      0%  { top: 0%; opacity: 0.7; }
      100%{ top: 100%; opacity: 0; }
    }

    /* center content */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* name with glitch */
    .name-wrap {
      position: relative;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
      animation-delay: 3s;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(64px, 11vw, 130px);
      font-weight: 300;
      letter-spacing: 0.14em;
      line-height: 1;
      color: var(--white);
      position: relative;
    }

    .name em {
      font-style: italic;
      color: var(--accent);
    }

    .name::before,
    .name::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-family: 'Cormorant Garamond', serif;
      font-size: inherit;
      font-weight: 300;
      letter-spacing: 0.14em;
    }

    .name::before {
      color: #f00;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
      animation: glitch1 5s infinite;
      animation-delay: 4s;
      opacity: 0;
    }

    .name::after {
      color: #0ff;
      clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
      animation: glitch2 5s infinite;
      animation-delay: 4.1s;
      opacity: 0;
    }

    @keyframes glitch1 {
      0%,93%,100% { transform: translate(0); opacity: 0; }
      94% { transform: translate(-4px, 1px); opacity: 0.5; }
      96% { transform: translate(4px, -1px); opacity: 0.5; }
      98% { transform: translate(0); opacity: 0; }
    }

    @keyframes glitch2 {
      0%,93%,100% { transform: translate(0); opacity: 0; }
      94% { transform: translate(4px, -1px); opacity: 0.4; }
      96% { transform: translate(-4px, 1px); opacity: 0.4; }
      98% { transform: translate(0); opacity: 0; }
    }

    /* divider line */
    .reveal-line {
      width: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--dim), transparent);
      margin: 1.8rem 0 1.6rem;
      animation: expandLine 1s cubic-bezier(0.77,0,0.18,1) forwards;
      animation-delay: 3.5s;
    }

    @keyframes expandLine {
      to { width: min(380px, 45vw); }
    }

    /* subtitle scroll marquee */
    .subtitle-wrap {
      overflow: hidden;
      width: min(420px, 80vw);
      opacity: 0;
      mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 3.8s;
    }

    .subtitle {
      display: inline-block;
      white-space: nowrap;
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--dim);
      animation: marquee 10s linear infinite;
      animation-delay: 4s;
      padding-right: 4rem;
    }

    .subtitle span {
      padding-right: 4rem;
    }

    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* bottom handle */
    .handle {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--dim);
      white-space: nowrap;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 4.8s;
    }

    .handle span { color: var(--accent); }

    /* corner marks */
    .corner {
      position: absolute;
      width: 18px; height: 18px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 3.1s;
    }
    .corner.tl { top: 1.5rem; left: 1.5rem; border-top: 1px solid var(--dim); border-left: 1px solid var(--dim); }
    .corner.tr { top: 1.5rem; right: 1.5rem; border-top: 1px solid var(--dim); border-right: 1px solid var(--dim); }
    .corner.bl { bottom: 1.5rem; left: 1.5rem; border-bottom: 1px solid var(--dim); border-left: 1px solid var(--dim); }
    .corner.br { bottom: 1.5rem; right: 1.5rem; border-bottom: 1px solid var(--dim); border-right: 1px solid var(--dim); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="vignette"></div>

  <div id="loader">
    <div class="loader-text">DECRYPTING IDENTITY . . . . . . . .</div>
  </div>

  <div class="scene">
    <div class="scan-sweep"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="top-bar">
      <div class="coord-tag">0°N 0°E — NULL ISLAND</div>
      <div class="blink-dot"></div>
      <div class="coord-tag">IDENTITY CONFIRMED</div>
    </div>

    <div class="center">
      <div class="name-wrap">
        <div class="name" data-text="Arya VL">Arya <em>VL</em></div>
      </div>
      <div class="reveal-line"></div>
      <div class="subtitle-wrap">
        <div class="subtitle">
          <span>yes it's me — you found the void &nbsp;&nbsp;✦&nbsp;&nbsp; yes it's me — you found the void &nbsp;&nbsp;✦&nbsp;&nbsp;</span><span>yes it's me — you found the void &nbsp;&nbsp;✦&nbsp;&nbsp; yes it's me — you found the void &nbsp;&nbsp;✦&nbsp;&nbsp;</span>
        </div>
      </div>
    </div>

    <div class="handle">@<span>coordinates_of_shadows</span></div>
  </div>
</body>
</html>
